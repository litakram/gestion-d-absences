version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gesteco-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=gesteco
      - DB_USERNAME=root
      - DB_PASSWORD=
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on:
      - db
    networks:
      - gesteco-network

  db:
    image: mysql:8.0
    container_name: gesteco-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=gesteco
      - MYSQL_USER=root
      - MYSQL_PASSWORD= 
      - MYSQL_ROOT_PASSWORD=
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - gesteco-network

networks:
  gesteco-network:
    driver: bridge

volumes:
  db-data:
    driver: local
